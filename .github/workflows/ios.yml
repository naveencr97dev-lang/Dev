name: Build unsigned IPA

on:
  push:
    branches: ["**"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned archive)
        run: |
          set -o pipefail
          xcodebuild \
            -project Streaklet.xcodeproj \
            -scheme Streaklet \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Streaklet.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true
          # Fail explicitly if the archive wasn't produced.
          test -d "$PWD/build/Streaklet.xcarchive"

      - name: Package unsigned IPA
        run: |
          cd build
          APP_PATH="Streaklet.xcarchive/Products/Applications/Streaklet.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Streaklet-unsigned.ipa Payload
          rm -rf Payload
          ls -lh Streaklet-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Streaklet-unsigned-ipa
          path: ios/build/Streaklet-unsigned.ipa
          if-no-files-found: error

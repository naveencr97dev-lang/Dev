# UI tour: builds Auction XI for the iOS simulator on a GitHub Mac, runs ios/UITests/TourTests
# (taps through every screen in landscape and portrait, plays two matches) and publishes the
# screenshots, a screen recording and the notes to the `ui-tour-shots` branch, replacing the last
# run. Free on a public repository.
#
# Runs on a push to a claude/** branch whose commit message contains [tour], or by hand
# (Actions › UI tour › Run workflow).
name: UI tour

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-tour
  cancel-in-progress: true

jobs:
  tour:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[tour]')
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode and simulator runtimes
        run: |
          # The runner's default Xcode: its simulator runtimes are installed (a newer Xcode may lack them).
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Pick and boot the largest iPhone simulator
        id: sim
        timeout-minutes: 12
        run: |
          xcrun simctl list devices available
          NAME=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+ Pro Max" | sort -V | tail -1)
          UDID=$(xcrun simctl list devices available | grep "$NAME (" | head -1 | grep -oE "[0-9A-F]{8}-[0-9A-F-]{27}")
          echo "Using $NAME ($UDID)"
          test -n "$UDID"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          for i in $(seq 1 60); do
            if xcrun simctl list devices | grep "$UDID" | grep -q Booted; then echo "Booted after ${i}0 s"; break; fi
            sleep 10
          done
          xcrun simctl list devices | grep "$UDID"

      - name: Run the tour (with a screen recording)
        timeout-minutes: 40
        run: |
          mkdir -p ~/ui-tour
          xcrun simctl io "${{ steps.sim.outputs.udid }}" recordVideo --codec=h264 --force ~/ui-tour/tour.mp4 &
          REC=$!
          cd ios
          set +e
          xcodebuild test \
            -project AuctionXI.xcodeproj \
            -scheme AuctionXI \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:AuctionXIUITests \
            -resultBundlePath "$RUNNER_TEMP/tour.xcresult" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/xcodebuild.log" 2>&1
          STATUS=$?
          set -e
          kill -INT $REC || true
          sleep 5
          tail -150 "$RUNNER_TEMP/xcodebuild.log" > ~/ui-tour/xcodebuild-tail.txt
          grep -E "error:|failed|Test Case|Executed" "$RUNNER_TEMP/xcodebuild.log" | tail -60 > ~/ui-tour/test-summary.txt || true
          echo "$STATUS" > ~/ui-tour/exit-status.txt
          echo "xcodebuild exit status: $STATUS"

      - name: Fall back to the result bundle's attachments
        if: always()
        run: |
          if ! ls ~/ui-tour/*.png >/dev/null 2>&1 && [ -d "$RUNNER_TEMP/tour.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/tour.xcresult" --output-path ~/ui-tour/attachments || true
          fi
          ls -la ~/ui-tour || true

      - name: Shrink the recording
        if: always()
        run: |
          # GitHub refuses files over 100 MB: re-encode small, drop it if it's still too big.
          if [ -f ~/ui-tour/tour.mp4 ]; then
            avconvert --source ~/ui-tour/tour.mp4 --preset Preset960x540 --output ~/ui-tour/tour-small.mp4 --replace || true
            rm -f ~/ui-tour/tour.mp4
            if [ -f ~/ui-tour/tour-small.mp4 ] && [ "$(stat -f%z ~/ui-tour/tour-small.mp4)" -gt 90000000 ]; then
              rm -f ~/ui-tour/tour-small.mp4
            fi
          fi
          ls -la ~/ui-tour | tail -5

      - name: Publish to the ui-tour-shots branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/pub" && cd "$RUNNER_TEMP/pub"
          cp -R ~/ui-tour/. . 2>/dev/null || true
          find . -type f -size +95M -delete
          {
            echo "# UI tour"
            echo
            echo "- Commit: ${{ github.sha }} on ${{ github.ref_name }}"
            echo "- Simulator: ${{ steps.sim.outputs.name }}"
            echo "- Xcode: $(xcodebuild -version 2>/dev/null | tr '\n' ' ')"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Screenshots: $(ls *.png 2>/dev/null | wc -l | tr -d ' ')"
          } > RUN.md
          git init -q
          git checkout -q --orphan ui-tour-shots
          git add -A
          git -c user.name="ui-tour" -c user.email="ui-tour@users.noreply.github.com" commit -qm "UI tour for ${{ github.sha }}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" HEAD:ui-tour-shots

# Codemagic CI config — builds an UNSIGNED Streaklet IPA for sideloading (Signulous).
# Free tier: macOS M-series instance, ~500 min/month. No signing certs needed.
#
# Setup (one time):
#   1. Sign up at https://codemagic.io with your GitHub account.
#   2. Add application -> pick naveencr97dev-lang/Dev -> "iOS App" (uses this yaml).
#   3. Start build on branch claude/reverse-engineer-repo-rnfy93.
#   4. Download the Streaklet-unsigned.ipa artifact -> upload to Signulous.

workflows:
  ios-unsigned:
    name: Streaklet unsigned IPA
    # No instance_type set -> Codemagic uses your plan's default macOS instance
    # (works on the free tier). Add one only if you have a paid instance.
    max_build_duration: 30
    environment:
      xcode: 15.4
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR/ios"
          xcodegen generate

      - name: Build unsigned archive
        script: |
          cd "$CM_BUILD_DIR/ios"
          xcodebuild \
            -project Streaklet.xcodeproj \
            -scheme Streaklet \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/Streaklet.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        script: |
          cd "$CM_BUILD_DIR/build"
          APP_PATH="Streaklet.xcarchive/Products/Applications/Streaklet.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Streaklet-unsigned.ipa Payload
          ls -lh Streaklet-unsigned.ipa
    artifacts:
      - build/Streaklet-unsigned.ipa
